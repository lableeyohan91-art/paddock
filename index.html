<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <title>Paddock</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"></div>PADDOCK</div>
      <div class="spacer"></div>
      <div class="weather-chip" id="weatherChip"></div>
      <button class="acct" id="acctBtn" title="Compte et synchronisation"><span id="acctIco">👤</span><span id="acctLabel">Compte</span></button>
      <button class="conn" id="connBtn"><span class="dot" id="connDot"></span><span id="connLabel">Non connecté</span></button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-view="race"><i>🏠</i><span>Menu</span></button>
      <button data-view="drivers"><i>👤</i><span>Pilotes</span></button>
      <button data-view="garage"><i>🔧</i><span>Garage</span></button>
      <button data-view="ghost"><i>👻</i><span>Fantôme</span></button>
      <button data-view="stats"><i>📈</i><span>Stats</span></button>
      <button data-view="settings"><i>⚙️</i><span>Réglages</span></button>
    </nav>
    <button class="livebar hidden" id="liveBar"></button>
    <main id="main"></main>
  </div>
  <div id="modalRoot"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
